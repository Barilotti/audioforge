name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          files=$(git ls-files '*.h' '*.hpp' '*.cpp')
          clang-format-18 --dry-run --Werror $files

  linux:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-debug, linux-gcc-debug, linux-clang-release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-tidy-18 \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Static analysis (clang-tidy)
        if: matrix.preset == 'linux-clang-debug'
        run: |
          run-clang-tidy-18 -quiet -p build/${{ matrix.preset }} \
            "$GITHUB_WORKSPACE/(src|apps|tests)/" 2>&1 | tee clang-tidy.log
          if grep -E "(warning|error):" clang-tidy.log; then
            echo "::error::clang-tidy reported findings"
            exit 1
          fi

  rtsan:
    name: Linux RealtimeSanitizer (Clang 20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 20 and dependencies
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y --no-install-recommends ninja-build libclang-rt-20-dev \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: Configure
        run: cmake --preset linux-clang-rtsan
      - name: Build
        run: cmake --build --preset linux-clang-rtsan
      - name: Test
        run: ctest --preset linux-clang-rtsan

  windows:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc-${{ matrix.config }} -- /m
      - name: Test
        run: ctest --preset windows-msvc-${{ matrix.config }}
      - name: Build installer
        if: matrix.config == 'release'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION\s+(\S+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item build/windows-msvc/apps/AudioForge/AudioForge_artefacts/RelWithDebInfo/AudioForge.exe build/package/
          Copy-Item build/windows-msvc/apps/af-render/RelWithDebInfo/af-render.exe build/package/
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$PWD\build\package" "/DOutputDir=$PWD\build\installer" installer\AudioForge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installer (silent install, run, uninstall)
        if: matrix.config == 'release'
        shell: pwsh
        run: |
          $setup = Get-ChildItem build/installer/*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\AF-Test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $env:AUDIOFORGE_DATA_DIR = "$env:RUNNER_TEMP\af-installed"
          $p = Start-Process C:\AF-Test\AudioForge.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed AudioForge failed: $($p.ExitCode)" }
          & C:\AF-Test\af-render.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Installed af-render failed" }
          $p = Start-Process C:\AF-Test\unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path C:\AF-Test\AudioForge.exe) { throw "AudioForge.exe is still present after uninstall" }
      - name: Upload application and installer
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: AudioForge-windows-x64-${{ github.sha }}
          path: |
            build/installer/*.exe
            build/package/*.exe
            build/windows-msvc/apps/AudioForge/AudioForge_artefacts/RelWithDebInfo/AudioForge.pdb
          if-no-files-found: error
          retention-days: 30
